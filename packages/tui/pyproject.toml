[project]
name = "sentarc-tui"
version = "0.1.1"
description = "Terminal UI library for Sentarc — textual-based components and TUI orchestration"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "wcwidth>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# sentarc-mono: files live directly in src/, mapped to sentarc_tui package
package-dir = {"sentarc_tui" = "src"}
packages = ["sentarc_tui", "sentarc_tui.components"]
