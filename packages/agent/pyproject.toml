[project]
name = "sentarc-agent"
version = "0.1.4"
description = "Stateful agent loop with tool execution and event streaming"
requires-python = ">=3.11"
dependencies = [
    "sentarc-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# sentarc-mono: files live under src/sentarc_agent
package-dir = {"sentarc_agent" = "src/sentarc_agent"}
packages = ["sentarc_agent"]
